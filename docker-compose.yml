version: '3.8'

services:
  store-converter:
    build: .
    container_name: store-converter-api
    restart: always
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/platforms"]
      interval: 30s
      timeout: 10s
      retries: 3
